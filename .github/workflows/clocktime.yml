name: Clocktime regression

on:
  push:
    branches: ['paper-writing-revision']
    paths: ['test/test_gettime/**', '.github/workflows/clocktime.yml']
  pull_request:
    paths: ['test/test_gettime/**', '.github/workflows/clocktime.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clocktime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record environment and exact tested source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          {
            git rev-parse HEAD
            uname -a
            gcc --version
            python3 --version
            git count-objects -v
          } > validation/environment.txt
          git bundle create validation/repository.bundle HEAD
          (cd validation && sha256sum repository.bundle > SHA256SUMS)
      - name: Direct API and production-reader host fixtures
        env:
          VKSO_TEST_ARTIFACTS: validation/codegen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s test/test_gettime/vkso-tests/direct-api/tests -p 'test_*.py' -v 2>&1 | tee validation/direct-api.log
      - name: Source audit unit tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s test/test_gettime/vkso-tests/code-size -p 'test_audit_changes.py' -v 2>&1 | tee validation/source-audit.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: clocktime-host-${{ github.sha }}
          path: validation/
          retention-days: 14
          if-no-files-found: error

  kernel-objects:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [normal, no-retpoline]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Linux 5.15.198 and Kbuild dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev libssl-dev qemu-system-x86 busybox-static
          mkdir -p validation
          curl -fL --retry 2 --max-time 180 https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.15.198.tar.xz -o "$RUNNER_TEMP/linux-5.15.198.tar.xz"
          sha256sum "$RUNNER_TEMP/linux-5.15.198.tar.xz" > validation/upstream-source.sha256
          tar -xJf "$RUNNER_TEMP/linux-5.15.198.tar.xz" -C "$RUNNER_TEMP"
      - name: Compare baseline and candidate Kbuild objects
        shell: bash
        run: |
          set -euo pipefail
          python3 test/test_gettime/vkso-tests/revision/kernel-reader/validate_build.py \
            --source "$RUNNER_TEMP/linux-5.15.198" --out "$PWD/validation/objects" \
            --variant '${{ matrix.variant }}' --cc gcc --jobs 2 --boot-smoke 2>&1 | tee validation/build-driver.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: clocktime-objects-${{ matrix.variant }}-${{ github.sha }}
          path: validation/
          retention-days: 14
          if-no-files-found: error
