<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480"
     viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">Fault-driven page grafting over a standard file-backed mapping</title>
  <desc id="desc">Vector figure generated from the checked experiment artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#687386"/>
    </marker>
    <style>
      text { font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="560.00" y="32.00" text-anchor="middle" font-size="19" font-weight="700" fill="#202938" style="">Fault-driven Resident-page Grafting</text>
  <text x="560.00" y="53.00" text-anchor="middle" font-size="11.5" font-weight="400" fill="#687386" style="">The loader-visible object remains ordinary; only selected backing entries change</text>
  <text x="55.00" y="88.00" text-anchor="start" font-size="13" font-weight="700" fill="#202938" style="">(a)</text>
  <text x="89.00" y="88.00" text-anchor="start" font-size="13" font-weight="600" fill="#202938" style="">Resident kernel object</text>
  <rect x="55.00" y="110.00" width="260.00" height="100.00" rx="8.00" fill="#F4F6F9" stroke="#3568A8" stroke-width="1.5" opacity="1"/>
  <text x="185.00" y="140.00" text-anchor="middle" font-size="12.5" font-weight="700" fill="#202938" style="">Kernel/LKM virtual mapping</text>
  <text x="185.00" y="165.00" text-anchor="middle" font-size="10.2" font-weight="400" fill="#687386" style="">RX / RO; already resident</text>
  <text x="185.00" y="187.00" text-anchor="middle" font-size="10.2" font-weight="400" fill="#687386" style="">module + page references held</text>
  <text x="395.00" y="88.00" text-anchor="start" font-size="13" font-weight="700" fill="#202938" style="">(b)</text>
  <text x="429.00" y="88.00" text-anchor="start" font-size="13" font-weight="600" fill="#202938" style="">File-object backing</text>
  <rect x="395.00" y="110.00" width="300.00" height="100.00" rx="8.00" fill="#FFFFFF" stroke="#7656A5" stroke-width="1.5" opacity="1"/>
  <text x="545.00" y="138.00" text-anchor="middle" font-size="12.5" font-weight="700" fill="#202938" style="">Stub DSO logical slot</text>
  <text x="545.00" y="161.00" text-anchor="middle" font-size="10.2" font-weight="400" fill="#687386" style="">file offset → pgoff</text>
  <text x="545.00" y="184.00" text-anchor="middle" font-size="10.2" font-weight="400" fill="#687386" style="">manifest: source · permissions · class</text>
  <text x="775.00" y="88.00" text-anchor="start" font-size="13" font-weight="700" fill="#202938" style="">(c)</text>
  <text x="809.00" y="88.00" text-anchor="start" font-size="13" font-weight="600" fill="#202938" style="">Ordinary process view</text>
  <rect x="775.00" y="110.00" width="290.00" height="100.00" rx="8.00" fill="#F4F6F9" stroke="#D97732" stroke-width="1.5" opacity="1"/>
  <text x="920.00" y="140.00" text-anchor="middle" font-size="12.5" font-weight="700" fill="#202938" style="">ld.so file-backed VMA</text>
  <text x="920.00" y="165.00" text-anchor="middle" font-size="10.2" font-weight="400" fill="#687386" style="">symbols and virtual layout unchanged</text>
  <text x="920.00" y="187.00" text-anchor="middle" font-size="10.2" font-weight="400" fill="#687386" style="">no eager PTE population</text>
  <rect x="365.00" y="260.00" width="360.00" height="88.00" rx="8.00" fill="#FFFFFF" stroke="#7656A5" stroke-width="1.7" opacity="1"/>
  <text x="545.00" y="289.00" text-anchor="middle" font-size="13" font-weight="700" fill="#202938" style="">address_space[pgoff]</text>
  <text x="545.00" y="313.00" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687386" style="">grafting manager installs resident page reference</text>
  <line x1="545.00" y1="210.00" x2="545.00" y2="250.00" stroke="#687386" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/>
  <rect x="75.00" y="274.00" width="220.00" height="62.00" rx="7.00" fill="#FFFFFF" stroke="#3568A8" stroke-width="1.7" opacity="1"/>
  <text x="185.00" y="300.00" text-anchor="middle" font-size="12.5" font-weight="700" fill="#202938" style="">Resident physical page</text>
  <text x="185.00" y="321.00" text-anchor="middle" font-size="10.2" font-weight="400" fill="#687386" style="">single PFN</text>
  <line x1="315.00" y1="160.00" x2="355.00" y2="160.00" stroke="#687386" stroke-width="1.2" opacity="1"/>
  <line x1="355.00" y1="160.00" x2="355.00" y2="305.00" stroke="#687386" stroke-width="1.2" opacity="1"/>
  <line x1="355.00" y1="305.00" x2="305.00" y2="305.00" stroke="#687386" stroke-width="1.2" opacity="1" marker-end="url(#arrow)"/>
  <line x1="365.00" y1="305.00" x2="305.00" y2="305.00" stroke="#7656A5" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/>
  <rect x="795.00" y="274.00" width="250.00" height="62.00" rx="7.00" fill="#FFFFFF" stroke="#D97732" stroke-width="1.7" opacity="1"/>
  <text x="920.00" y="299.00" text-anchor="middle" font-size="12.5" font-weight="700" fill="#202938" style="">User PTE → same PFN</text>
  <text x="920.00" y="321.00" text-anchor="middle" font-size="10.2" font-weight="400" fill="#687386" style="">installed as RX or R--</text>
  <line x1="920.00" y1="210.00" x2="920.00" y2="254.00" stroke="#687386" stroke-width="1.3" opacity="1" marker-end="url(#arrow)"/>
  <text x="934.00" y="239.00" text-anchor="start" font-size="9.6" font-weight="400" fill="#687386" style="">first touch</text>
  <line x1="725.00" y1="305.00" x2="785.00" y2="305.00" stroke="#687386" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/>
  <rect x="235.00" y="388.00" width="650.00" height="48.00" rx="6.00" fill="#F4F6F9" stroke="#D9DEE7" stroke-width="1" opacity="1"/>
  <text x="560.00" y="408.00" text-anchor="middle" font-size="11.5" font-weight="700" fill="#202938" style="">Steady state: ordinary direct call + existing PTE</text>
  <text x="560.00" y="426.00" text-anchor="middle" font-size="9.8" font-weight="400" fill="#687386" style="">No syscall, runtime trampoline, symbol lookup, page copy, or writable user alias</text>
</svg>
