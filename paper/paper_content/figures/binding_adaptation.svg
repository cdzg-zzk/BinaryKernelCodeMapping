<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470"
     viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Private binding separates environment addresses from shared machine code</title>
  <desc id="desc">Vector figure generated from the checked experiment artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#687386"/>
    </marker>
    <style>
      text { font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="560.00" y="32.00" text-anchor="middle" font-size="19" font-weight="700" fill="#202938" style="">Environment-specific Binding without Patching Shared Text</text>
  <text x="560.00" y="53.00" text-anchor="middle" font-size="11.5" font-weight="400" fill="#687386" style="">Pseudo-GOT moves address ownership into domain-local slots</text>
  <rect x="390.00" y="82.00" width="340.00" height="76.00" rx="8.00" fill="#F4F6F9" stroke="#3568A8" stroke-width="1.7" opacity="1"/>
  <text x="560.00" y="112.00" text-anchor="middle" font-size="13" font-weight="700" fill="#202938" style="">Shared resident .text / .rodata</text>
  <text x="560.00" y="136.00" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687386" style="">PC-relative load from a declared binding slot</text>
  <line x1="500.00" y1="158.00" x2="285.00" y2="220.00" stroke="#687386" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/>
  <line x1="620.00" y1="158.00" x2="835.00" y2="220.00" stroke="#687386" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/>
  <text x="70.00" y="205.00" text-anchor="start" font-size="13" font-weight="700" fill="#202938" style="">(a)</text>
  <text x="104.00" y="205.00" text-anchor="start" font-size="13" font-weight="600" fill="#202938" style="">Kernel execution domain</text>
  <rect x="70.00" y="230.00" width="430.00" height="116.00" rx="8.00" fill="#FFFFFF" stroke="#3568A8" stroke-width="1.5" opacity="1"/>
  <rect x="95.00" y="260.00" width="165.00" height="56.00" rx="6.00" fill="#F4F6F9" stroke="#7656A5" stroke-width="1.2" opacity="1"/>
  <text x="177.50" y="282.00" text-anchor="middle" font-size="11.5" font-weight="700" fill="#202938" style="">.pseudo-got slot</text>
  <text x="177.50" y="301.00" text-anchor="middle" font-size="9.6" font-weight="400" fill="#687386" style="">module-private</text>
  <rect x="310.00" y="260.00" width="165.00" height="56.00" rx="6.00" fill="#F4F6F9" stroke="#3568A8" stroke-width="1.2" opacity="1"/>
  <text x="392.50" y="282.00" text-anchor="middle" font-size="11.5" font-weight="700" fill="#202938" style="">Kernel target</text>
  <text x="392.50" y="301.00" text-anchor="middle" font-size="9.6" font-weight="400" fill="#687386" style="">object or helper</text>
  <line x1="260.00" y1="288.00" x2="300.00" y2="288.00" stroke="#687386" stroke-width="1.4" opacity="1" marker-end="url(#arrow)"/>
  <text x="285.00" y="335.00" text-anchor="middle" font-size="9.8" font-weight="400" fill="#687386" style="">module loader writes kernel VA</text>
  <text x="620.00" y="205.00" text-anchor="start" font-size="13" font-weight="700" fill="#202938" style="">(b)</text>
  <text x="654.00" y="205.00" text-anchor="start" font-size="13" font-weight="600" fill="#202938" style="">User execution domain</text>
  <rect x="620.00" y="230.00" width="430.00" height="116.00" rx="8.00" fill="#FFFFFF" stroke="#D97732" stroke-width="1.5" opacity="1"/>
  <rect x="645.00" y="260.00" width="165.00" height="56.00" rx="6.00" fill="#F4F6F9" stroke="#7656A5" stroke-width="1.2" opacity="1"/>
  <text x="727.50" y="282.00" text-anchor="middle" font-size="11.5" font-weight="700" fill="#202938" style="">.pseudo-got slot</text>
  <text x="727.50" y="301.00" text-anchor="middle" font-size="9.6" font-weight="400" fill="#687386" style="">carrier-private</text>
  <rect x="860.00" y="260.00" width="165.00" height="56.00" rx="6.00" fill="#F4F6F9" stroke="#D97732" stroke-width="1.2" opacity="1"/>
  <text x="942.50" y="282.00" text-anchor="middle" font-size="11.5" font-weight="700" fill="#202938" style="">User target</text>
  <text x="942.50" y="301.00" text-anchor="middle" font-size="9.6" font-weight="400" fill="#687386" style="">private object or shim</text>
  <line x1="810.00" y1="288.00" x2="850.00" y2="288.00" stroke="#687386" stroke-width="1.4" opacity="1" marker-end="url(#arrow)"/>
  <text x="835.00" y="335.00" text-anchor="middle" font-size="9.8" font-weight="400" fill="#687386" style="">ld.so writes user VA</text>
  <rect x="225.00" y="385.00" width="670.00" height="48.00" rx="6.00" fill="#F4F6F9" stroke="#D9DEE7" stroke-width="1" opacity="1"/>
  <text x="560.00" y="405.00" text-anchor="middle" font-size="11.2" font-weight="700" fill="#202938" style="">Invariant: the shared instruction bytes and read-only pages are identical in both domains</text>
  <text x="560.00" y="423.00" text-anchor="middle" font-size="9.8" font-weight="400" fill="#687386" style="">Only private slots differ; unresolved or privileged targets fail closed</text>
</svg>
