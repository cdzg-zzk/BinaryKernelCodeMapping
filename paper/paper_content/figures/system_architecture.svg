<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600"
     viewBox="0 0 1180 600" role="img" aria-labelledby="title desc">
  <title id="title">Constructing and rehosting a resident binary closure</title>
  <desc id="desc">Vector figure generated from the checked experiment artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#687386"/>
    </marker>
    <style>
      text { font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="590.00" y="31.00" text-anchor="middle" font-size="20" font-weight="700" fill="#202938" style="">Constructing and Rehosting a Resident Binary Closure</text>
  <text x="590.00" y="53.00" text-anchor="middle" font-size="11.5" font-weight="400" fill="#687386" style="">The contract defines what must hold; environment separation expands what can satisfy it</text>
  <rect x="55.00" y="78.00" width="1070.00" height="292.00" rx="10.00" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.2" opacity="1"/>
  <text x="76.00" y="105.00" text-anchor="start" font-size="13" font-weight="700" fill="#202938" style="">Challenge 1 · Construct a rehostable binary closure</text>
  <rect x="85.00" y="146.00" width="210.00" height="84.00" rx="8.00" fill="#F4F6F9" stroke="#3568A8" stroke-width="1.5" opacity="1"/>
  <text x="190.00" y="176.00" text-anchor="middle" font-size="12.3" font-weight="700" fill="#202938" style="">Candidate dependencies</text>
  <text x="190.00" y="201.00" text-anchor="middle" font-size="9.8" font-weight="400" fill="#687386" style="">code · data · control targets</text>
  <rect x="405.00" y="126.00" width="370.00" height="124.00" rx="9.00" fill="#FFFFFF" stroke="#7656A5" stroke-width="1.8" opacity="1"/>
  <text x="590.00" y="155.00" text-anchor="middle" font-size="13.5" font-weight="700" fill="#202938" style="">Reuse contract</text>
  <text x="590.00" y="182.00" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687386" style="">state · control · code-shape properties</text>
  <text x="590.00" y="209.00" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687386" style="">defines a valid cross-domain closure</text>
  <text x="590.00" y="232.00" text-anchor="middle" font-size="9.5" font-weight="400" fill="#687386" style="">not a whitelist of naturally pure functions</text>
  <rect x="885.00" y="146.00" width="190.00" height="84.00" rx="8.00" fill="#F4F6F9" stroke="#16877A" stroke-width="1.5" opacity="1"/>
  <text x="980.00" y="176.00" text-anchor="middle" font-size="12.3" font-weight="700" fill="#202938" style="">Rehostable closure</text>
  <text x="980.00" y="199.00" text-anchor="middle" font-size="9.7" font-weight="400" fill="#687386" style="">resident code/rodata</text>
  <text x="980.00" y="217.00" text-anchor="middle" font-size="9.3" font-weight="400" fill="#687386" style="">+ explicit environment contract</text>
  <line x1="295.00" y1="188.00" x2="395.00" y2="188.00" stroke="#687386" stroke-width="1.6" opacity="1" marker-end="url(#arrow)"/>
  <line x1="775.00" y1="188.00" x2="875.00" y2="188.00" stroke="#687386" stroke-width="1.6" opacity="1" marker-end="url(#arrow)"/>
  <rect x="405.00" y="282.00" width="370.00" height="62.00" rx="7.00" fill="#F4F6F9" stroke="#D97732" stroke-width="1.3" opacity="1"/>
  <text x="590.00" y="307.00" text-anchor="middle" font-size="11.5" font-weight="700" fill="#202938" style="">Environment separation</text>
  <text x="590.00" y="329.00" text-anchor="middle" font-size="9.6" font-weight="400" fill="#687386" style="">PIC-compatible shape · Shim contracts · published inputs</text>
  <line x1="590.00" y1="282.00" x2="590.00" y2="260.00" stroke="#687386" stroke-width="1.3" opacity="1" marker-end="url(#arrow)"/>
  <text x="190.00" y="291.00" text-anchor="middle" font-size="10.8" font-weight="600" fill="#C84B4B" style="">Outside the reuse boundary</text>
  <text x="190.00" y="314.00" text-anchor="middle" font-size="9.2" font-weight="400" fill="#687386" style="">privileged or semantically incompatible dependencies</text>
  <text x="980.00" y="291.00" text-anchor="middle" font-size="10.8" font-weight="600" fill="#16877A" style="">Key invariant</text>
  <text x="980.00" y="314.00" text-anchor="middle" font-size="9.2" font-weight="400" fill="#687386" style="">same computation, explicit domain boundary</text>
  <rect x="55.00" y="398.00" width="1070.00" height="166.00" rx="10.00" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.2" opacity="1"/>
  <text x="76.00" y="425.00" text-anchor="start" font-size="13" font-weight="700" fill="#202938" style="">Challenge 2 · Rehost the closure as a standard user object</text>
  <rect x="85.00" y="458.00" width="235.00" height="72.00" rx="8.00" fill="#F4F6F9" stroke="#7656A5" stroke-width="1.5" opacity="1"/>
  <text x="202.50" y="485.00" text-anchor="middle" font-size="12.1" font-weight="700" fill="#202938" style="">Rehostable closure</text>
  <text x="202.50" y="508.00" text-anchor="middle" font-size="9.5" font-weight="400" fill="#687386" style="">shared execution body + contract</text>
  <rect x="375.00" y="458.00" width="210.00" height="72.00" rx="8.00" fill="#F4F6F9" stroke="#3568A8" stroke-width="1.5" opacity="1"/>
  <text x="480.00" y="485.00" text-anchor="middle" font-size="12.1" font-weight="700" fill="#202938" style="">Standard carrier</text>
  <text x="480.00" y="508.00" text-anchor="middle" font-size="9.5" font-weight="400" fill="#687386" style="">symbols · ABI · virtual layout</text>
  <rect x="640.00" y="458.00" width="220.00" height="72.00" rx="8.00" fill="#F4F6F9" stroke="#16877A" stroke-width="1.5" opacity="1"/>
  <text x="750.00" y="485.00" text-anchor="middle" font-size="12.1" font-weight="700" fill="#202938" style="">Page grafting</text>
  <text x="750.00" y="508.00" text-anchor="middle" font-size="9.5" font-weight="400" fill="#687386" style="">logical pages → resident physical pages</text>
  <rect x="915.00" y="458.00" width="180.00" height="72.00" rx="8.00" fill="#F4F6F9" stroke="#D97732" stroke-width="1.5" opacity="1"/>
  <text x="1005.00" y="485.00" text-anchor="middle" font-size="12.1" font-weight="700" fill="#202938" style="">Ordinary user call</text>
  <text x="1005.00" y="508.00" text-anchor="middle" font-size="9.5" font-weight="400" fill="#687386" style="">standard loader + first touch</text>
  <line x1="320.00" y1="494.00" x2="365.00" y2="494.00" stroke="#687386" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/>
  <line x1="585.00" y1="494.00" x2="630.00" y2="494.00" stroke="#687386" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/>
  <line x1="860.00" y1="494.00" x2="905.00" y2="494.00" stroke="#687386" stroke-width="1.5" opacity="1" marker-end="url(#arrow)"/>
  <text x="590.00" y="548.00" text-anchor="middle" font-size="10.4" font-weight="400" fill="#687386" style="">same physical execution body · ordinary shared-library call · no per-call mediation</text>
</svg>
